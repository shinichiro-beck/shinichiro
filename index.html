<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIプロンプトスキル診断</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 flex items-center justify-center min-h-screen p-4">

    <div id="quiz-container" class="w-full max-w-2xl mx-auto">
        
        <!-- Start Screen -->
        <div id="start-screen" class="text-center bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-lg">
            <h1 class="text-3xl md:text-4xl font-bold text-indigo-600 dark:text-indigo-400 mb-4">AIプロンプトスキル診断</h1>
            <p class="text-lg text-gray-600 dark:text-gray-300 mb-8">AIから最高の答えを引き出す「聞き方」のスキルと、AIの基礎知識を診断します。あなたの現在地をチェックしてみましょう！</p>
            <button id="start-btn" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-lg text-xl transition duration-300 ease-in-out transform hover:scale-105">
                診断を始める
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="bg-white dark:bg-gray-800 p-6 sm:p-8 rounded-2xl shadow-lg">
                <!-- Progress Bar and Question Number -->
                <div class="mb-6">
                    <div class="flex justify-between items-center mb-2">
                        <p class="text-sm font-medium text-indigo-600 dark:text-indigo-400">
                            <span id="current-question-num">1</span> / <span id="total-questions">8</span>
                        </p>
                    </div>
                    <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-500" style="width: 12.5%"></div>
                    </div>
                </div>

                <!-- Question -->
                <h2 id="question" class="text-xl md:text-2xl font-bold mb-6 min-h-[6rem]"></h2>
                
                <!-- Answer Options -->
                <div id="answer-buttons" class="grid grid-cols-1 gap-4">
                    <!-- Buttons will be generated by JS -->
                </div>

                <!-- Feedback and Explanation -->
                <div id="feedback-container" class="mt-6 p-4 rounded-lg min-h-[100px] hidden">
                    <p id="feedback-text" class="font-bold text-lg mb-2"></p>
                    <p id="explanation-text" class="text-gray-600 dark:text-gray-300"></p>
                </div>
                
                <!-- Next Button -->
                <div class="mt-8 text-right">
                    <button id="next-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 hidden">
                        次へ
                    </button>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden text-center bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-lg">
            <h2 class="text-3xl font-bold mb-4">診断結果</h2>
            
            <div id="result-icon-container" class="w-24 h-24 mx-auto my-4"></div>

            <p id="result-title" class="text-3xl font-bold mb-2"></p>
            <p id="score-text" class="text-xl font-medium text-gray-500 dark:text-gray-400 mb-6"></p>

            <p id="result-message" class="text-gray-600 dark:text-gray-300 mb-8 max-w-md mx-auto"></p>
            
            <a href="#" id="cta-link" class="inline-block w-full sm:w-auto bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-8 rounded-lg text-lg transition duration-300 ease-in-out transform hover:scale-105 mb-4 shadow-md">
                次のステップへ進む
            </a>

            <div class="mt-4">
                <button id="restart-btn" class="w-full sm:w-auto bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-lg text-base transition duration-300 ease-in-out transform hover:scale-105">
                    もう一度挑戦する
                </button>
            </div>
        </div>

    </div>

    <script>
        const quizData = [
            {
                question: "そもそも「AI（人工知能）」とは、どのような技術を指す言葉ですか？",
                answers: [
                    { text: "人間の学習や判断といった知的活動を、コンピューターで実現する技術の総称。", isCorrect: true },
                    { text: "インターネットに繋がった全ての機械のこと。", isCorrect: false },
                    { text: "人間と全く同じ感情を持つロボットのこと。", isCorrect: false },
                    { text: "決められた作業だけを高速に繰り返すプログラムのこと。", isCorrect: false }
                ],
                explanation: "AIは単なる自動化プログラムとは異なり、学習や推論といった「知的なふるまい」を模倣する幅広い技術を指します。"
            },
            {
                question: "ChatGPTや画像生成AIのように、新しいコンテンツを創り出すAIを特に何と呼びますか？",
                answers: [
                    { text: "分析AI", isCorrect: false },
                    { text: "認識AI", isCorrect: false },
                    { text: "制御AI", isCorrect: false },
                    { text: "生成AI (ジェネレーティブAI)", isCorrect: true }
                ],
                explanation: "生成AIは、学習したデータからパターンを学び、文章、画像、音楽といった全く新しい、オリジナルのコンテンツを「生成」するのが特徴です。"
            },
            {
                question: "AIを使いこなす上で、最も重要な心構えはどれですか？",
                answers: [
                    { text: "プロンプトを一回で完璧に作り込み、最高の答えを一発で引き出すこと。", isCorrect: false },
                    { text: "AIを、具体的な指示が必要な「優秀だけど新人なアシスタント」と捉えること。", isCorrect: true },
                    { text: "AIが出した答えを、常に正しいと信じること。", isCorrect: false },
                    { text: "できるだけ複雑で難しい単語を使って指示を出すこと。", isCorrect: false }
                ],
                explanation: "AIは万能の魔法の箱ではありません。優秀ですが、指示がなければ動けない新人のような存在です。こちらが意図を明確に伝え、育てていくという意識を持つことが、AI活用の第一歩です。"
            },
            {
                question: "AIにプロ並みのキャッチコピーを考えてもらう時、最も効果的な指示の出だしはどれですか？",
                answers: [
                    { text: "新商品のキャッチコピーを提案してください。", isCorrect: false },
                    { text: "あなたは一流のコピーライターです。キャッチコピーを考えてください。", isCorrect: true },
                    { text: "商品の広告に使える、魅力的な文章を作成してください。", isCorrect: false },
                    { text: "何かキャッチーで面白い言葉を教えてください。", isCorrect: false }
                ],
                explanation: "AIに「役割」を与えることで、その役割になりきり、専門的な視点から質の高い回答を生成しやすくなります。これはプロンプトの基本的なテクニックです。"
            },
            {
                question: "長い文章をAIに要約してもらいます。一番質の高い要約が期待できる指示はどれですか？",
                answers: [
                    { text: "この記事の内容を、誰にでも分かるように要約してください。", isCorrect: false },
                    { text: "この記事を、SNS投稿用に100文字以内で、絵文字を交えて要約してください。", isCorrect: true },
                    { text: "この記事の文章量を、だいたい半分くらいに短くしてください。", isCorrect: false },
                    { text: "この記事で、読者が最も重要だと感じる箇所を教えてください。", isCorrect: false }
                ],
                explanation: "「誰に」「何を」「どのような形式で」伝えるのかを具体的に指示することが重要です。文字数や文体、用途を指定することで、AIは意図を正確に汲み取ります。"
            },
            {
                question: "AIの回答が期待外れでした。次にとるべき最も適切な行動はどれですか？",
                answers: [
                    { text: "AIでは無理だと判断し、自分で一から考え直す。", isCorrect: false },
                    { text: "結果が変わるかもしれないので、全く同じ質問を再度送信してみる。", isCorrect: false },
                    { text: "指示の曖昧な点を改善し、より具体的な条件を加えて質問し直す。", isCorrect: true },
                    { text: "AIの回答が間違っていることを、「違う、そうじゃない」と簡潔に指摘する。", isCorrect: false }
                ],
                explanation: "AIとの対話は一回で終わりではありません。最初の回答をヒントに、プロンプトを修正・改善していく「対話のキャッチボール」がスキルアップの鍵です。"
            },
            {
                question: "京都へ家族旅行に行く際のプランをAIに立ててもらう時、最高の提案を引き出すために「含めるべきでない」情報はどれですか？",
                answers: [
                    { text: "「11月中旬に3日間で」といった旅行の時期と日数。", isCorrect: false },
                    { text: "「小学生の子供が歴史好き」といった参加者の情報。", isCorrect: false },
                    { text: "「いい感じのプランをよろしく」という曖昧な依頼。", isCorrect: true },
                    { text: "「海鮮料理が好き」といった食事に関する好み。", isCorrect: false }
                ],
                explanation: "「いい感じ」のような主観的で曖昧な言葉は、AIを混乱させる原因になります。具体的な要望（例：「子供が楽しめる体験を多めに」「移動時間が少ないプラン」）を伝えることが重要です。"
            },
            {
                question: "AIを利用する上で注意すべき点として挙げられる「AIのバイアス」とは、どのような問題ですか？",
                answers: [
                    { text: "学習データに含まれる偏見をAIが学び、不公平な判断をしてしまう問題。", isCorrect: true },
                    { text: "AIの電気代が非常に高くなってしまう問題。", isCorrect: false },
                    { text: "AIが特定のメーカーの製品ばかりを推奨してしまう問題。", isCorrect: false },
                    { text: "AIの回答速度が人間より速すぎてしまう問題。", isCorrect: false }
                ],
                explanation: "AIはデータから社会の偏見（ジェンダーや人種など）を学んでしまうことがあります。そのため、AIの回答は常に鵜呑みにせず、批判的な視点を持つことが大切です。"
            }
        ];

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const nextBtn = document.getElementById('next-btn');

        const questionEl = document.getElementById('question');
        const answerButtonsEl = document.getElementById('answer-buttons');
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackText = document.getElementById('feedback-text');
        const explanationText = document.getElementById('explanation-text');
        
        const progressBar = document.getElementById('progress-bar');
        const currentQuestionNum = document.getElementById('current-question-num');
        const totalQuestions = document.getElementById('total-questions');

        const scoreText = document.getElementById('score-text');
        const resultTitle = document.getElementById('result-title');
        const resultMessage = document.getElementById('result-message');
        const resultIconContainer = document.getElementById('result-icon-container');
        const ctaLink = document.getElementById('cta-link');

        // State variables
        let currentQuestionIndex = 0;
        let score = 0;

        // Event Listeners
        startBtn.addEventListener('click', startQuiz);
        restartBtn.addEventListener('click', startQuiz);
        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                showQuestion();
            } else {
                showResult();
            }
        });

        // Functions
        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            totalQuestions.textContent = quizData.length;
            showQuestion();
        }

        function showQuestion() {
            resetState();
            const currentQuestion = quizData[currentQuestionIndex];
            questionEl.textContent = currentQuestion.question;

            currentQuestion.answers.forEach(answer => {
                const button = document.createElement('button');
                button.textContent = answer.text;
                button.classList.add('w-full', 'p-4', 'text-left', 'bg-gray-100', 'dark:bg-gray-700', 'rounded-lg', 'hover:bg-indigo-100', 'dark:hover:bg-gray-600', 'transition', 'duration-200', 'border-2', 'border-transparent');
                if (answer.isCorrect) {
                    button.dataset.correct = true;
                }
                button.addEventListener('click', selectAnswer);
                answerButtonsEl.appendChild(button);
            });
            
            updateProgress();
        }

        function resetState() {
            nextBtn.classList.add('hidden');
            feedbackContainer.classList.add('hidden');
            while (answerButtonsEl.firstChild) {
                answerButtonsEl.removeChild(answerButtonsEl.firstChild);
            }
        }

        function selectAnswer(e) {
            const selectedBtn = e.target;
            const isCorrect = selectedBtn.dataset.correct === 'true';

            if (isCorrect) {
                score++;
                feedbackText.textContent = "正解！";
                feedbackContainer.style.backgroundColor = 'rgba(34, 197, 94, 0.1)';
                feedbackText.style.color = '#22c55e';
                selectedBtn.classList.add('bg-green-100', 'dark:bg-green-900/50', 'border-green-500');
            } else {
                feedbackText.textContent = "不正解...";
                feedbackContainer.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
                feedbackText.style.color = '#ef4444';
                selectedBtn.classList.add('bg-red-100', 'dark:bg-red-900/50', 'border-red-500');
            }

            explanationText.textContent = quizData[currentQuestionIndex].explanation;
            feedbackContainer.classList.remove('hidden');

            Array.from(answerButtonsEl.children).forEach(button => {
                if (button.dataset.correct === 'true' && !isCorrect) {
                   button.classList.add('bg-green-100', 'dark:bg-green-900/50', 'border-green-500');
                }
                button.disabled = true;
            });

            nextBtn.classList.remove('hidden');
        }

        function updateProgress() {
            const progressPercentage = ((currentQuestionIndex + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercentage}%`;
            currentQuestionNum.textContent = currentQuestionIndex + 1;
        }

        function showResult() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            const finalScore = `${score} / ${quizData.length}`;
            scoreText.textContent = `正解数: ${finalScore}`;

            let level, message, icon, ctaText, ctaHref;
            const percentage = (score / quizData.length) * 100;

            const goldIcon = `<svg class="w-full h-full" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#clip0_105_195)"><path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20ZM16.24 9.24L15.18 10.3L17.96 13.08L16.9 14.14L14.12 11.36L13.06 12.42L15.84 15.2L14.78 16.26L12 13.48L9.22 16.26L8.16 15.2L10.94 12.42L9.88 11.36L7.1 14.14L6.04 13.08L8.82 10.3L7.76 9.24L10.54 6.46L12 7.92L13.46 6.46L16.24 9.24Z" fill="#FBBF24"/></g><defs><clipPath id="clip0_105_195"><rect width="24" height="24" fill="white"/></clipPath></defs></svg>`;
            const silverIcon = `<svg class="w-full h-full" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#clip0_105_198)"><path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20ZM16.24 9.24L15.18 10.3L17.96 13.08L16.9 14.14L14.12 11.36L13.06 12.42L15.84 15.2L14.78 16.26L12 13.48L9.22 16.26L8.16 15.2L10.94 12.42L9.88 11.36L7.1 14.14L6.04 13.08L8.82 10.3L7.76 9.24L10.54 6.46L12 7.92L13.46 6.46L16.24 9.24Z" fill="#9CA3AF"/></g><defs><clipPath id="clip0_105_198"><rect width="24" height="24" fill="white"/></clipPath></defs></svg>`;
            const bronzeIcon = `<svg class="w-full h-full" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#clip0_105_201)"><path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20ZM16.24 9.24L15.18 10.3L17.96 13.08L16.9 14.14L14.12 11.36L13.06 12.42L15.84 15.2L14.78 16.26L12 13.48L9.22 16.26L8.16 15.2L10.94 12.42L9.88 11.36L7.1 14.14L6.04 13.08L8.82 10.3L7.76 9.24L10.54 6.46L12 7.92L13.46 6.46L16.24 9.24Z" fill="#F97316"/></g><defs><clipPath id="clip0_105_201"><rect width="24" height="24" fill="white"/></clipPath></defs></svg>`;

            if (percentage >= 80) {
                level = "ランクA：プロンプト・マスター";
                message = "素晴らしい！あなたはAIの能力を最大限に引き出す術を心得ています。そのスキルで、仕事や創作活動をさらに高いレベルへ導けるでしょう。";
                icon = goldIcon;
                ctaText = "マスター向け応用講座へ";
                ctaHref = "#expert-course";
                resultTitle.className = "text-3xl font-bold mb-2 text-amber-500 dark:text-amber-400";
            } else if (percentage >= 50) {
                level = "ランクB：プロンプト・エンジニア";
                message = "AIとの対話の基本は完璧です。あと一歩、より高度な指示や条件設定を学ぶことで、AIを真のパートナーにすることができます。";
                icon = silverIcon;
                ctaText = "実践スキルアップ講座へ";
                ctaHref = "#practitioner-course";
                resultTitle.className = "text-3xl font-bold mb-2 text-slate-500 dark:text-slate-400";
            } else {
                level = "ランクC：プロンプトの卵";
                message = "AIとのコミュニケーションの第一歩を踏み出しましたね！AIは「聞き方」次第で大きく変わります。基本を学べば、可能性は無限に広がります。";
                icon = bronzeIcon;
                ctaText = "初心者向け入門講座へ";
                ctaHref = "#beginner-course";
                resultTitle.className = "text-3xl font-bold mb-2 text-orange-600 dark:text-orange-500";
            }
            resultTitle.textContent = level;
            resultMessage.textContent = message;
            resultIconContainer.innerHTML = icon;
            ctaLink.textContent = ctaText;
            ctaLink.href = ctaHref;
        }
    </script>
</body>
</html>
